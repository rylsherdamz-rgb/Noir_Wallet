<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Jost';
    src: url('file:///home/richie/.fonts/Jost-Regular.ttf') format('truetype');
    font-weight: 400; font-style: normal;
  }
  @font-face {
    font-family: 'Jost';
    src: url('file:///home/richie/.fonts/Jost-Medium.ttf') format('truetype');
    font-weight: 500; font-style: normal;
  }
  @font-face {
    font-family: 'Jost';
    src: url('file:///home/richie/.fonts/Jost-SemiBold.ttf') format('truetype');
    font-weight: 600; font-style: normal;
  }

  :root {
    --black: #050505;
    --card: #141414;
    --border: #3A3A3A;
    --gold: #C6A15B;
    --gold-hi: #E9C482;
    --cream: #EDE4D0;
    --white: #FFFFFF;
    --muted: #A9A9A9;
    --dim: #666666;
    --green: #3ED598;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* 1:1 square — ideal for Facebook / IG feed. 1200x1200 @2x = 2400x2400 */
  html, body { width: 1200px; height: 1200px; }

  .stage {
    width: 1200px;
    height: 1200px;
    position: relative;
    overflow: hidden;
    font-family: 'Jost', sans-serif;
    background:
      radial-gradient(120% 130% at 50% 30%, rgba(198,161,91,0.18) 0%, rgba(198,161,91,0.05) 36%, rgba(198,161,91,0) 62%),
      radial-gradient(100% 120% at 30% 20%, #17140F 0%, #0C0B09 46%, #050505 100%);
  }

  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(198,161,91,0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(198,161,91,0.05) 1px, transparent 1px);
    background-size: 70px 70px;
    mask-image: radial-gradient(120% 100% at 50% 40%, #000 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(120% 100% at 50% 40%, #000 30%, transparent 80%);
  }

  .frame {
    position: absolute; inset: 26px;
    border: 1px solid rgba(58,58,58,0.55);
    border-radius: 24px;
    pointer-events: none;
  }

  .wrap {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 0 96px;
  }

  /* "WE'RE IN" badge */
  .badge {
    display: inline-flex; align-items: center; gap: 14px;
    padding: 14px 30px;
    border: 1px solid var(--gold);
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(198,161,91,0.14) 0%, rgba(198,161,91,0.04) 100%);
    box-shadow: 0 0 34px rgba(198,161,91,0.18);
    font-weight: 600; font-size: 24px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--gold-hi);
  }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 12px var(--gold); }

  /* Big announcement headline */
  .headline {
    margin-top: 46px;
    font-weight: 600;
    font-size: 108px;
    line-height: 0.98;
    letter-spacing: -3px;
    color: var(--white);
  }
  .headline .accent { color: var(--gold); }

  /* Program / event line */
  .program {
    margin-top: 30px;
    font-weight: 500;
    font-size: 40px;
    letter-spacing: 0.4px;
    color: var(--cream);
  }

  .subhead {
    margin-top: 26px;
    font-weight: 400;
    font-size: 27px;
    line-height: 1.5;
    color: var(--muted);
    max-width: 760px;
  }

  .rule {
    margin-top: 44px;
    height: 4px; width: 260px;
    border-radius: 2px;
    background: linear-gradient(90deg, rgba(198,161,91,0) 0%, var(--gold) 50%, rgba(198,161,91,0) 100%);
  }

  /* Brand lockup: logo + wordmark */
  .lockup {
    margin-top: 44px;
    display: flex; align-items: center; gap: 26px;
  }
  .lockup .logowrap {
    position: relative; width: 128px; height: 128px;
    display: flex; align-items: center; justify-content: center;
  }
  .lockup .halo {
    position: absolute; inset: -16px;
    background: radial-gradient(circle at 50% 46%, rgba(198,161,91,0.30) 0%, rgba(198,161,91,0.06) 48%, rgba(198,161,91,0) 70%);
  }
  .lockup img {
    width: 128px; height: auto;
    mix-blend-mode: screen;
    -webkit-mask-image: radial-gradient(circle at 50% 48%, #000 52%, transparent 70%);
    mask-image: radial-gradient(circle at 50% 48%, #000 52%, transparent 70%);
    filter: contrast(1.08) saturate(1.06) brightness(1.05);
  }
  .lockup .wordmark {
    font-weight: 600; font-size: 58px; letter-spacing: -2px; white-space: nowrap;
  }
  .lockup .wordmark .noir { color: var(--cream); }
  .lockup .wordmark .wallet { color: var(--gold); margin-left: 14px; }

  .footer {
    position: absolute;
    left: 0; right: 0; bottom: 60px;
    display: flex; align-items: center; justify-content: center; gap: 18px;
    color: var(--dim);
  }
  .footer .handle { font-weight: 500; font-size: 22px; letter-spacing: 1.2px; }
  .footer .sep { width: 1px; height: 20px; background: var(--border); }
  .footer .tag { font-weight: 400; font-size: 20px; letter-spacing: 0.5px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="grid"></div>
    <div class="frame"></div>

    <div class="wrap">
      <div class="badge"><span class="dot"></span>We're In</div>

      <div class="headline">Selected for<br><span class="accent">[Program Name]</span></div>

      <div class="program">Cohort / Batch 2026</div>

      <div class="subhead">Noir Wallet — x402 contactless payments on Stellar — is officially part of the program. Grateful to build the future of tap-and-go payments.</div>

      <div class="rule"></div>

      <div class="lockup">
        <div class="logowrap">
          <div class="halo"></div>
          <img src="file:///home/richie/Projects/Noir_Wallet/promo/pubmat/logo.jpg" alt="Noir Wallet">
        </div>
        <div class="wordmark"><span class="noir">NOIR</span><span class="wallet">WALLET</span></div>
      </div>
    </div>

    <div class="footer">
      <span class="handle">@ChichiCode0</span>
      <span class="sep"></span>
      <span class="tag">noirwallet.app</span>
    </div>
  </div>
</body>
</html>
