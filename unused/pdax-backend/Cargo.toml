[package]
name = "noir-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
aes-gcm = "0.10"
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio", "uuid", "chrono", "json"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# PDAX session cache uses parking_lot::RwLock.
parking_lot = "0.12"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
futures = "0.3"
dotenv = "0.15"
hex = "0.4"
base64 = "0.21"
reqwest = { version = "0.11", features = ["json"] }
# Wallet-signature auth: strkey decodes the G-address, dalek verifies the
# signature over the challenge nonce. No transaction building, so no
# stellar-xdr.
stellar-strkey = "0.0.18"
rand = "0.8"
ed25519-dalek = "2"

[dev-dependencies]
tokio-test = "0.4"
uuid = { version = "1.6", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
