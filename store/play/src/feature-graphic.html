<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Noir feature graphic</title>
<style>
  @font-face { font-family: Jost; font-weight: 400; src: url(../../../frontend/assets/fonts/Jost-Regular.ttf); }
  @font-face { font-family: Jost; font-weight: 500; src: url(../../../frontend/assets/fonts/Jost-Medium.ttf); }
  @font-face { font-family: Jost; font-weight: 600; src: url(../../../frontend/assets/fonts/Jost-SemiBold.ttf); }
  :root { --bg: #0a0a0a; --ink: #f3ecdd; --gold: #c9a35f; --gold-hi: #e6c88c; --muted: #9c968c; --line: #2a2723; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    position: relative; font-family: Jost, sans-serif; color: var(--ink);
    background:
      radial-gradient(circle at 74% 52%, rgba(201,163,95,.22) 0, rgba(201,163,95,0) 330px),
      linear-gradient(180deg, #0f0e0c 0%, var(--bg) 100%);
  }
  /* faint grid for depth */
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(circle at 74% 50%, #000 0, transparent 420px);
  }

  .copy { position: absolute; left: 64px; top: 50%; transform: translateY(-50%); width: 470px; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
  .brand img { width: 46px; }
  .brand span { font-weight: 500; font-size: 20px; letter-spacing: 8px; }
  h1 { font-weight: 600; font-size: 58px; line-height: 1.04; letter-spacing: -1px; }
  h1 em { font-style: normal; color: var(--gold); }
  .sub { margin-top: 20px; font-size: 20px; line-height: 1.4; color: var(--muted); }
  .chips { display: flex; gap: 10px; margin-top: 28px; }
  .chip {
    font-size: 15px; font-weight: 500; color: var(--gold-hi); padding: 7px 14px;
    border: 1px solid rgba(201,163,95,.35); border-radius: 999px; background: rgba(201,163,95,.06);
  }

  .stage { position: absolute; right: 0; top: 0; width: 470px; height: 500px; }

  .phone {
    position: absolute; left: 190px; top: 46px; width: 226px; height: 488px;
    border-radius: 34px; padding: 7px; background: #1b1a18;
    border: 1px solid #3a3631; transform: rotate(6deg);
    box-shadow: 0 40px 90px rgba(0,0,0,.75), inset 0 0 0 1px rgba(255,255,255,.04);
  }
  .screen { width: 100%; height: 100%; border-radius: 28px; overflow: hidden; background: var(--bg); }
  .screen img { width: 100%; display: block; }

  .waves { position: absolute; left: 128px; top: 172px; transform: rotate(6deg); }
  .waves span {
    position: absolute; border: 2px solid var(--gold); border-left-color: transparent; border-bottom-color: transparent;
    border-radius: 50%; transform: rotate(45deg);
  }
  .waves span:nth-child(1) { width: 34px; height: 34px; left: 0;   top: 0;   opacity: .95; }
  .waves span:nth-child(2) { width: 58px; height: 58px; left: -12px; top: -12px; opacity: .6; }
  .waves span:nth-child(3) { width: 82px; height: 82px; left: -24px; top: -24px; opacity: .3; }

  .card {
    position: absolute; left: 20px; top: 250px; width: 236px; height: 149px; border-radius: 14px;
    transform: rotate(-14deg);
    background:
      radial-gradient(circle at 20% 0%, rgba(255,255,255,.10), transparent 55%),
      linear-gradient(135deg, #1d1c1a 0%, #0b0b0a 60%, #151411 100%);
    border: 1px solid rgba(201,163,95,.45);
    box-shadow: 0 30px 60px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08);
    padding: 18px 20px;
  }
  .card .row { display: flex; align-items: center; justify-content: space-between; }
  .card img { width: 34px; }
  .card .nfc { color: var(--gold); font-size: 22px; letter-spacing: -3px; font-weight: 600; transform: scaleY(1.2); }
  .card .name { position: absolute; left: 20px; bottom: 34px; font-size: 13px; letter-spacing: 6px; color: var(--gold-hi); }
  .card .num { position: absolute; left: 20px; bottom: 15px; font-size: 11px; letter-spacing: 2px; color: var(--muted); }

  .toast {
    position: absolute; left: 238px; top: 384px; transform: rotate(6deg);
    display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 10px;
    background: rgba(22,21,19,.92); border: 1px solid #34302a; border-radius: 14px;
    box-shadow: 0 18px 40px rgba(0,0,0,.6); backdrop-filter: blur(6px);
  }
  .toast .tick {
    width: 30px; height: 30px; border-radius: 50%; background: #1f3b2c; color: #4fd18b;
    display: grid; place-items: center; font-size: 17px; font-weight: 600;
  }
  .toast b { display: block; font-size: 15px; font-weight: 600; }
  .toast small { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../../../frontend/assets/noir-mark.png" alt=""><span>NOIR</span></div>
    <h1>Tap your card.<br><em>Pay on Stellar.</em></h1>
    <p class="sub">A self-custody wallet with NFC cards that pay within the limits you set.</p>
    <div class="chips"><span class="chip">NFC tap-to-pay</span><span class="chip">Spending limits</span><span class="chip">Your keys</span></div>
  </div>

  <div class="stage">
    <div class="phone"><div class="screen"><img src="../../../frontend/assets/screenshots/01-wallet.png" alt=""></div></div>
    <div class="waves"><span></span><span></span><span></span></div>
    <div class="card">
      <div class="row"><img src="../../../frontend/assets/noir-mark.png" alt=""><span class="nfc">)))</span></div>
      <div class="name">BLACK CARD</div>
      <div class="num">GCQX ···· 4LMA</div>
    </div>
    <div class="toast"><span class="tick">✓</span><span><b>Paid 12.50 XLM</b><small>Coffee Stand · just now</small></span></div>
  </div>
</body>
</html>
