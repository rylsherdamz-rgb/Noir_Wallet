# Redeploy the Soroban contracts to Testnet, build the Android APK against the
# new contract IDs, and attach it to a GitHub release.
#
# Run it by hand: Actions → "Redeploy contracts + release APK" → Run workflow.
#
# What it does:
#   1. deploy  — checks out `base_branch` (instaward-development by default),
#                tests the contracts, runs scripts/redeploy-contracts.sh
#                (build → deploy → initialize → evidence file), then
#                scripts/propagate-contract-ids.sh swaps the old IDs and WASM
#                hashes for the new ones, and opens a PR into `base_branch` with
#                only those files + the new deploy-evidence file.
#   2. release — builds the `preview` profile APK on EAS from that PR's branch
#                (so the APK talks to the new contracts) and uploads Noir.apk and
#                the evidence file to the release.
#
# One-time setup (Settings → Secrets and variables → Actions):
#   STELLAR_DEPLOYER_SECRET  secret key (S…) of the funded Testnet deployer/admin
#   EXPO_TOKEN               expo.dev → Account settings → Access tokens
#   RELEASE_PR_TOKEN         (optional) fine-grained PAT with contents + pull
#                            requests write. A PR opened with the default
#                            GITHUB_TOKEN does not trigger CI, so the required
#                            `test` check never reports on it; a PAT avoids that.
# Without RELEASE_PR_TOKEN, enable Settings → Actions → General → "Allow GitHub
# Actions to create and approve pull requests", then close and reopen the ID PR
# to start its CI. If the PR cannot be opened, the branch is still pushed.
#
# Every redeploy mints brand-new contract IDs (clean slate, not an upgrade).
name: Redeploy contracts + release APK

on:
  workflow_dispatch:
    inputs:
      redeploy:
        description: 'Redeploy the contracts first (off = only rebuild the APK from the selected branch)'
        type: boolean
        default: true
      base_branch:
        description: 'Branch to redeploy from and open the ID PR into'
        type: string
        default: instaward-development
      release_tag:
        description: 'Release to attach Noir.apk to (created as a pre-release if it does not exist)'
        type: string
        default: Beta-Test

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: redeploy-release
  cancel-in-progress: false

env:
  STELLAR_CLI_VERSION: '28.0.0'

jobs:
  deploy:
    name: Redeploy contracts to Testnet
    if: inputs.redeploy
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.push.outputs.branch }}
      evidence: ${{ steps.ids.outputs.evidence }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          # Must match backend/rust-toolchain.toml (see contracts.yml).
          toolchain: '1.98.1'
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache Stellar CLI
        id: stellar-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/stellar
          key: ${{ runner.os }}-stellar-cli-${{ env.STELLAR_CLI_VERSION }}

      - name: Install Stellar CLI
        if: steps.stellar-cache.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli --version "$STELLAR_CLI_VERSION"

      # Never deploy contracts whose tests fail. payment_escrow contractimport!s
      # the other two WASMs, so they are built first.
      - name: Test contracts
        working-directory: backend
        run: |
          cargo build --release --target wasm32v1-none -p agent-registry -p device-registry
          cargo build --release --target wasm32v1-none -p payment-escrow
          HOST=$(rustc -vV | awk '/host/{print $2}')
          cargo test -p device-registry -p agent-registry -p payment-escrow --target "$HOST"

      - name: Load deployer identity
        env:
          STELLAR_DEPLOYER_SECRET: ${{ secrets.STELLAR_DEPLOYER_SECRET }}
        run: |
          [ -n "$STELLAR_DEPLOYER_SECRET" ] || { echo "::error::STELLAR_DEPLOYER_SECRET is not set"; exit 1; }
          mkdir -p ~/.config/stellar/identity
          umask 077
          printf 'secret_key = "%s"\n' "$STELLAR_DEPLOYER_SECRET" > ~/.config/stellar/identity/deployer.toml
          echo "Deployer: $(stellar keys address deployer)"

      - name: Redeploy + initialize
        id: redeploy
        run: NETWORK=testnet DEPLOYER=deployer ./scripts/redeploy-contracts.sh

      - name: Read new contract IDs
        id: ids
        env:
          EVIDENCE: ${{ steps.redeploy.outputs.evidence }}
        run: |
          [ -f "$EVIDENCE" ] || { echo "::error::redeploy-contracts.sh reported no evidence file"; exit 1; }
          get() { grep -m1 "^$1=" "$EVIDENCE" | cut -d= -f2; }
          {
            echo "evidence=$EVIDENCE"
            echo "device=$(get EXPO_PUBLIC_DEVICE_REGISTRY_CONTRACT)"
            echo "agent=$(get EXPO_PUBLIC_AGENT_REGISTRY_CONTRACT)"
            echo "escrow=$(get EXPO_PUBLIC_PAYMENT_ESCROW_CONTRACT)"
          } >> "$GITHUB_OUTPUT"
          cat "$EVIDENCE" >> "$GITHUB_STEP_SUMMARY"

      # The script validates every old/new ID and hash before it edits anything.
      - name: Propagate new IDs and hashes across the repo
        id: propagate
        env:
          EVIDENCE: ${{ steps.ids.outputs.evidence }}
        run: |
          ./scripts/propagate-contract-ids.sh "$EVIDENCE" > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"

      - name: Push ID branch and open PR
        id: push
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          BASE: ${{ inputs.base_branch }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVIDENCE: ${{ steps.ids.outputs.evidence }}
          NEW_DEVICE: ${{ steps.ids.outputs.device }}
          NEW_AGENT: ${{ steps.ids.outputs.agent }}
          NEW_ESCROW: ${{ steps.ids.outputs.escrow }}
        run: |
          BRANCH="redeploy/testnet-$(basename "$EVIDENCE" .md | sed 's/^deploy-testnet-//')"
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Only the propagated files + the evidence file. cargo build/test can
          # touch Cargo.lock and test snapshots; those stay out of this commit.
          xargs -a "$RUNNER_TEMP/changed.txt" -d '\n' git add --
          git add -- "$EVIDENCE"
          git commit -F - <<MSG
          chore(contracts): redeploy to Testnet and propagate new contract IDs

          Redeployed by the redeploy-release workflow ($RUN_URL).
          Evidence: $EVIDENCE

          device_registry: $NEW_DEVICE
          agent_registry: $NEW_AGENT
          payment_escrow: $NEW_ESCROW

          Co-Authored-By: Johnrick Rabara <jrabara101@gmail.com>
          Co-Authored-By: Jefferson Tuparan <jeffersontuparanst@gmail.com>
          MSG
          git push -u origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          {
            echo "Automated Testnet redeploy ([workflow run]($RUN_URL))."
            echo
            echo "| Contract | ID |"
            echo "|---|---|"
            echo "| device_registry | \`$NEW_DEVICE\` |"
            echo "| agent_registry | \`$NEW_AGENT\` |"
            echo "| payment_escrow | \`$NEW_ESCROW\` |"
            echo
            echo "Evidence: \`$EVIDENCE\`. The APK built from this branch is attached to the \`$RELEASE_TAG\` release."
            echo
            echo "Only IDs and WASM hashes were swapped. Before merging, check the prose around them by hand:"
            echo "- deploy dates and \"see deploy-evidence/…\" pointers (README, PROGRESS, CLAUDE.md, docs/)"
            echo "- \`docs/Evidence/README.md\`, \`docs/walkthrough.md\` and \`docs/evidence-package.md\` still describe the previous deploy on purpose; add this deploy to them"
            echo "- the expected hashes in \`.github/workflows/contracts.yml\`"
          } > "$RUNNER_TEMP/pr.md"
          gh pr create --base "$BASE" --head "$BRANCH" \
            --title "chore(contracts): redeploy to Testnet and propagate new contract IDs" \
            --body-file "$RUNNER_TEMP/pr.md" \
            || echo "::warning::Could not open the PR (see the setup notes at the top of this workflow). Branch $BRANCH is pushed."

  release:
    name: Build APK and attach to release
    needs: deploy
    # Runs after a successful redeploy, or alone when redeploy is off.
    if: always() && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.deploy.outputs.branch || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      # The `preview` profile builds an APK; contract IDs come from eas.json `base`.
      - name: Build APK on EAS
        working-directory: frontend
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > build.json
          URL=$(jq -r '.[0].artifacts.buildUrl' build.json)
          [ -n "$URL" ] && [ "$URL" != "null" ] || { echo "::error::EAS returned no APK URL"; cat build.json; exit 1; }
          curl -fsSL "$URL" -o "$RUNNER_TEMP/Noir.apk"
          sha256sum "$RUNNER_TEMP/Noir.apk"

      # An existing release keeps its tag and its own notes; the block between
      # the noir-apk-build markers is rewritten on every run so the notes always
      # say which commit and contracts the attached APK was built from.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVIDENCE: ${{ needs.deploy.outputs.evidence }}
        run: |
          SHA=$(git rev-parse HEAD)
          id() { jq -r ".build.base.env.$1" frontend/eas.json; }
          {
            echo "<!-- noir-apk-build -->"
            echo "**Noir.apk** built from [\`${SHA:0:7}\`](https://github.com/$REPO/commit/$SHA) by [this workflow run]($RUN_URL)."
            echo
            echo "| Contract (Testnet) | ID |"
            echo "|---|---|"
            echo "| device_registry | \`$(id EXPO_PUBLIC_DEVICE_REGISTRY_CONTRACT)\` |"
            echo "| agent_registry | \`$(id EXPO_PUBLIC_AGENT_REGISTRY_CONTRACT)\` |"
            echo "| payment_escrow | \`$(id EXPO_PUBLIC_PAYMENT_ESCROW_CONTRACT)\` |"
            echo "<!-- /noir-apk-build -->"
          } > "$RUNNER_TEMP/build-block.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" --json body -q .body > "$RUNNER_TEMP/old-notes.md"
            python3 - "$RUNNER_TEMP/old-notes.md" "$RUNNER_TEMP/build-block.md" > "$RUNNER_TEMP/notes.md" <<'PY'
          import re, sys
          old, block = (open(p).read() for p in sys.argv[1:3])
          pat = re.compile(r"<!-- noir-apk-build -->.*?<!-- /noir-apk-build -->\n?", re.S)
          print(pat.sub(lambda _: block, old) if pat.search(old) else old.rstrip() + "\n\n" + block, end="")
          PY
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --prerelease --target "$SHA" --title "$TAG" \
              --notes-file "$RUNNER_TEMP/build-block.md"
          fi
          FILES=("$RUNNER_TEMP/Noir.apk")
          [ -n "$EVIDENCE" ] && FILES+=("$EVIDENCE")
          gh release upload "$TAG" "${FILES[@]}" --clobber
          echo "Uploaded to https://github.com/$REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
