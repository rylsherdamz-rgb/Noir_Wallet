name: Frontend CI

on:
  push:
    branches: [main, instaward, instaward-staging, instaward-development]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  # No path filter on pull requests: `test` is a required status check on the
  # protected branches, and a path-filtered required check never reports on a
  # PR outside frontend/ (e.g. landing-only), which blocks the merge forever.
  pull_request:

defaults:
  run:
    working-directory: frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @stellar/stellar-sdk v16 requires node >= 22; 22.23.4 patches Node2Shell (CVE-2026-111497)
          node-version: 22.23.4
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: yarn test
