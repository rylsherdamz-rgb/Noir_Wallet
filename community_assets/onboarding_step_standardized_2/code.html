<!-- Interactive Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const aiCard = document.querySelector('.floating-anim');
      if (aiCard) {
        aiCard.addEventListener('mouseenter', () => aiCard.style.animationPlayState = 'paused');
        aiCard.addEventListener('mouseleave', () => aiCard.style.animationPlayState = 'running');
      }

      const buttons = document.querySelectorAll('button');
      buttons.forEach(btn => {
        btn.addEventListener('click', function(e) {
          const rect = this.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const ripple = document.createElement('span');
          ripple.style.position = 'absolute';
          ripple.style.left = x + 'px';
          ripple.style.top = y + 'px';
          ripple.style.width = '0px';
          ripple.style.height = '0px';
          ripple.style.background = 'rgba(255, 255, 255, 0.2)';
          if (this.classList.contains('bg-transparent')) ripple.style.background = 'rgba(0, 56, 168, 0.1)';
          ripple.style.borderRadius = '50%';
          ripple.style.transform = 'translate(-50%, -50%)';
          ripple.style.transition = 'width 0.6s ease-out, height 0.6s ease-out, opacity 0.6s ease-out';
          ripple.style.pointerEvents = 'none';
          this.style.position = 'relative';
          this.style.overflow = 'hidden';
          this.appendChild(ripple);
          
          requestAnimationFrame(() => {
            ripple.style.width = '400px';
            ripple.style.height = '400px';
            ripple.style.opacity = '0';
          });
          
          setTimeout(() => ripple.remove(), 600);
        });
      });
    });
  </script>
