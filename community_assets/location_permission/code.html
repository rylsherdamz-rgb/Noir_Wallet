</div>
<div class="absolute bottom-8 right-4 glass-panel px-sm py-xs rounded-full flex items-center gap-xs shadow-md">
<span class="material-symbols-outlined text-secondary text-[18px]">storefront</span>

</div>
</div>
</div>

            </p>

<!-- Navigation Shell (Suppressed for focused permission flow as per Source of Truth) -->
<!-- The BottomNavBar and TopAppBar are excluded here to prioritize the Content Canvas for this transactional screen -->
<script>
        // Simple micro-interaction for the button
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', () => {
                button.classList.add('scale-95');
            });
            button.addEventListener('touchend', () => {
                button.classList.remove('scale-95');
            });
        });

        // Simulating the interaction logic
        const allowBtn = document.querySelector('button.bg-primary');
        const notNowBtn = document.querySelector('button.text-primary');

        allowBtn.addEventListener('click', () => {
            console.log('Location access requested...');
            // In a real app, this would trigger the system permission dialog
        });

        notNowBtn.addEventListener('click', () => {
            console.log('User deferred location access.');
        });
    </script>
