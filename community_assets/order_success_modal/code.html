<script>
    // Micro-interaction for the success icon
    document.addEventListener('DOMContentLoaded', () => {
      const checkIcon = document.querySelector('.material-symbols-outlined[style*="check_circle"]');
      if (checkIcon) {
        checkIcon.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
        checkIcon.style.transform = 'scale(0)';
        setTimeout(() => {
          checkIcon.style.transform = 'scale(1)';
        }, 300);
      }
    });
