<script>
        // Simple micro-interaction for feedback
        const nextBtn = document.querySelector('button.bg-primary');
        nextBtn.addEventListener('click', (e) => {
            // Navigation handled by inline onclick, this is for visual feedback
            nextBtn.classList.add('opacity-80');
        });

        // Refined interactive floating effect
        document.addEventListener('mousemove', (e) => {
            const amount = 8;
            const x = (e.clientX / window.innerWidth - 0.5) * amount;
            const y = (e.clientY / window.innerHeight - 0.5) * amount;
            const hero = document.querySelector('.animate-float');
            if (hero) {
                hero.style.transform = `translate(${x}px, ${y}px)`;
            }
        });
    </script>
