<script>
        // Simple micro-interaction for the "Next" button
        const nextBtn = document.querySelector('button.bg-primary');
        nextBtn.addEventListener('click', () => {
            // In a real app, this would navigate to Step 4
            document.body.classList.add('opacity-0', 'transition-opacity', 'duration-500');
            setTimeout(() => {
                alert("Navigating to Step 4: Community Feed");
                document.body.classList.remove('opacity-0');
            }, 500);
        });

        // Interactive floating effect enhancement
        document.addEventListener('mousemove', (e) => {
            const amount = 10;
            const x = (e.clientX / window.innerWidth - 0.5) * amount;
            const y = (e.clientY / window.innerHeight - 0.5) * amount;
            const hero = document.querySelector('.animate-float');
            hero.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
