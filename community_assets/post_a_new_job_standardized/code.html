<form class="flex flex-col gap-6 bg-surface-container-lowest p-6 rounded-xl form-shadow">

</button>
<button class="flex items-center gap-3 px-4 py-3 rounded-lg bg-secondary-container/10 border-2 border-secondary-container transition-all" type="button">

<span class="material-symbols-outlined text-[20px]">send</span>

                </p>
</div>

</main>
<script>
    // Micro-interactions for category selection
    document.querySelectorAll('button[type="button"]').forEach(btn => {
        btn.addEventListener('click', function() {
            // Standardizing behavior: Clear others in the category group
            const parent = this.parentElement;
            if (parent.classList.contains('grid-cols-2')) {
                parent.querySelectorAll('button').forEach(other => {
                    other.classList.remove('bg-secondary-container/10', 'border-2', 'border-secondary-container');
                    other.classList.add('bg-surface-container-low', 'border', 'border-outline-variant');
                    const icon = other.querySelector('.material-symbols-outlined');
                    if (icon) icon.style.fontVariationSettings = "'FILL' 0";
                    other.querySelector('span:not(.material-symbols-outlined)').classList.remove('font-semibold');
                });

                this.classList.remove('bg-surface-container-low', 'border', 'border-outline-variant');
                this.classList.add('bg-secondary-container/10', 'border-2', 'border-secondary-container');
                const icon = this.querySelector('.material-symbols-outlined');
                if (icon) icon.style.fontVariationSettings = "'FILL' 1";
                this.querySelector('span:not(.material-symbols-outlined)').classList.add('font-semibold');
            }
        });
    });

    // Form submission simulation
    const form = document.querySelector('form');
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const btn = form.querySelector('button[type="submit"]');
        const originalContent = btn.innerHTML;
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Posting...';
        btn.classList.add('opacity-90', 'pointer-events-none');
        
        setTimeout(() => {
            btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Success!';
            btn.classList.replace('bg-primary', 'bg-secondary');
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.classList.replace('bg-secondary', 'bg-primary');
                btn.classList.remove('opacity-90', 'pointer-events-none');
            }, 2000);
        }, 1200);
    });
</script>
